<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Bancosol | Inicio de sesión</title>
	<link rel="stylesheet" href="css/login.css">
	<script src="javascript/login.js" defer></script>
</head>
<body>
	<header class="topbar topbar-login">
		<a class="brand" href="index.html" aria-label="Bancosol inicio">
			<img src="assets/LOGO_BANCOSOL.png" alt="Logo Bancosol" class="logo">
		</a>

		<nav class="main-nav main-nav-login" id="main-nav">
			<a href="index.html">Inicio</a>
			<a href="register.html">No tengo cuenta</a>
			<a href="index.html#contacto">Contacto</a>
		</nav>
	</header>

	<main class="login-page">
		<section class="login-card" aria-labelledby="login-title">
			<div class="brand-lockup">
				<img src="assets/Bancosol.png" alt="Bancosol" class="logo">
				<div>
					<p class="brand-name">Bancosol</p>
					<p class="brand-subtitle">Acceso interno y colaborador</p>
				</div>
			</div>

			<div class="card-copy">
				<h2 id="login-title">Iniciar sesión</h2>
				<p>Ingresa tus credenciales para entrar al espacio de trabajo.</p>
			</div>

			<form id="login-form" class="login-form" method="post">
				<label for="email">Correo</label>
				<div class="input-shell">
					<input id="email" name="email" type="email" placeholder="bancosolseguimiento@gmail.com" required>
				</div>

				<label for="password">Contraseña de acceso</label>
				<div class="input-shell password-shell">
					<input id="password" name="password" type="password" placeholder="Ingresa tu contraseña" required>
					<button class="toggle-password" type="button" id="toggle-password">Mostrar</button>
				</div>

				<button type="submit" class="login-button">Entrar al espacio</button>
				<p class="form-message" id="form-message"></p>
				<p class="auth-switch">No tengo cuenta: <a class="forgot-link" href="register.html">Crear cuenta</a></p>
			</form>
		</section>
	</main>

	<footer class="site-footer">
		<img src="assets/LOGO_BANCOSOL.png" alt="Logo Bancosol" class="logo">
		<p>Bancosol · Banco de alimentos</p>
	</footer>
</body>
</html>
