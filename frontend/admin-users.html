<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bancosol | Usuarios</title>
    <link rel="stylesheet" href="css/admin.css">
    <script src="javascript/admin-users.js" defer></script>
    <script src="javascript/includeHTML.js" defer></script>
    <script src="javascript/header.js" defer></script>
    <script src="javascript/export.js" defer></script>
    <script src="javascript/includeHTML.js" defer></script>
    <script src="javascript/header.js" defer></script>

</head>
<body>

    <include-html src="header.html"></include-html>

    <main class="page-wrapper">
        <div class="page-header">
            <a href="admin.html" style="display:inline-flex;align-items:center;gap:.4rem;font-size:.88rem;font-weight:700;color:var(--blue-700);text-decoration:none;margin-bottom:1rem;">← Volver al panel</a>
            <h1>Usuarios</h1>
            <p>Gestiona los usuarios registrados en la plataforma.</p>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>Listado de usuarios</h2>
                <div class="card-actions">
                    <button onclick="exportarExcel('users')" class="btn-export">Exportar archivo</button>
                    <button class="btn btn-edit btn-sm" id="btn-refresh">↻ Actualizar</button>
                </div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Telefono</th>
                            <th>Rol actual</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody">
                        <tr><td colspan="6" class="table-empty">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toast-container"></div>

</body>
</html>
